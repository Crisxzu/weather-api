name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: "ci-secret-key-not-used-in-production"
          DJANGO_DEBUG: "1"
          WEATHER_API_KEY: "ci-dummy-key"
          WEATHER_API_BASE_URL: "http://api.weatherapi.com/v1"
          WEATHER_API_SOURCE_NAME: "Weather API"
          WEATHER_API_SOURCE_LINK: "https://www.weatherapi.com/"
          WEATHER_PRIMARY_PROVIDER: "weatherapi"
          WEATHER_FALLBACK_PROVIDER: "openmeteo"
        run: python manage.py test api.tests --verbosity=2
